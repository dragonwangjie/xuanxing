# Project-wide Gradle settings.

# ── JVM ─────────────────────────────────────────────────────────────
# 玄星：:app 是超大模块（420 个 Kotlin 文件 + Compose），编译期堆需求高；
# 同时限制 Metaspace 并固定 ParallelGC，避免 Gradle 守护进程因 GC 抖动被杀。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Kotlin 编译守护进程单独给堆，避免与 Gradle 守护进程抢内存。
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m

# ── 提速 ────────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
# 按需配置在本项目多模块下收益有限，且与 configuration-cache 冲突，保持关闭默认。
org.gradle.configureondemand=false

# ── Kotlin / KSP 增量编译 ───────────────────────────────────────────
kotlin.incremental=true
ksp.incremental=true

# ── AndroidX ────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本仓库在 AGP 9.x 下关闭 configuration-cache，避免缓存串味导致的诡异配置错误。
org.gradle.configuration-cache=false

# 工程路径可能含非 ASCII 字符（例如放在含中文的目录里）
android.overridePathCheck=true

# ── 网络超时：依赖下载卡死时不要无限等待（默认无超时）────────────────
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000