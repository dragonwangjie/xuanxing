name: Release APK

# ── 两种触发方式 ────────────────────────────────────────────────
# 1) 标签触发：推送形如 v1.1.3 的 tag，自动构建并发布正式 Release
#      git tag v1.1.3 && git push origin v1.1.3
# 2) 手动触发：Actions 页面 -> "Release APK" -> Run workflow，
#    填写 version（默认 1.1.3）；发布 tag = v + version，标记为预发布（prerelease）
#
# ── 产物 ────────────────────────────────────────────────────────
# Release 附带全部 APK：universal（通用包，推荐）+ arm64-v8a + x86_64，
# 以及 sha256 校验文件
#
# ── 正式签名（可选） ────────────────────────────────────────────
# 在仓库 Settings -> Secrets and variables -> Actions 配置以下 4 项：
#   RELEASE_STORE_FILE_B64 : keystore 文件的 base64（生成：base64 -w0 release.jks）
#   RELEASE_STORE_PASSWORD : keystore 密码
#   RELEASE_KEY_ALIAS      : 密钥别名
#   RELEASE_KEY_PASSWORD   : 密钥密码
# 4 项齐全即用正式签名；缺任一项自动回退 debug 签名（仍可正常安装，仅适合自用测试）。
# Firebase 已移除，无需 GOOGLE_SERVICES_JSON。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，发布 tag 为 v+版本号（例如 1.1.3）"
        required: true
        default: "1.1.3"

permissions:
  contents: write # 发布 Release 需要写权限

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    env:
      # CI 关闭国内镜像：aliyun 镜像在海外 runner 上不稳定，会让插件解析失败
      # （例如报 com.google.devtools.ksp:...:2.3.4 not found），改用官方仓库。
      XUANXING_CN_MIRROR: "0"
      # keystore 解码后的落盘位置，配合 app/build.gradle.kts 读取 local.properties 的签名配置
      STORE_FILE: ${{ github.workspace }}/release.keystore
    steps:
      - name: 检出代码（含子模块，必须 recursive）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # web 模块的 preBuild 会执行前端构建（web-ui），需要 Node + pnpm。
      # pnpm 的 action 必须放在 setup-node 之前，否则无法启用依赖缓存。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: 安装 web-ui 依赖
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 计算发布 tag：push(tag) 事件用 tag 本身（正式发布）；
      # workflow_dispatch 用 version 输入并补 v 前缀（预发布）。
      - name: 解析发布参数
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "trigger=tag" >> "$GITHUB_OUTPUT"
          else
            V="${{ github.event.inputs.version }}"
            case "$V" in
              v*) T="$V" ;;
              *) T="v$V" ;;
            esac
            echo "tag=$T" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备签名配置
        env:
          STORE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          STORE_PWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_B64" ]; then
            echo "未配置 RELEASE_STORE_FILE_B64，本次使用 debug 签名（可正常安装，仅供测试）"
            exit 0
          fi
          printf '%s' "$STORE_B64" | base64 -d > "$STORE_FILE"
          {
            echo "storeFile=$STORE_FILE"
            echo "storePassword=$STORE_PWD"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PWD"
          } > local.properties
          keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PWD" >/dev/null
          echo "keystore 校验通过，本次使用正式签名"

      # 网络预检：若构建阶段报插件/依赖解析失败，这一步能立即看出 runner
      # 到各官方仓库是否通（HTTP 200/303 为正常）。
      - name: 依赖仓库连通性预检
        run: |
          P=com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/2.3.4/com.google.devtools.ksp.gradle.plugin-2.3.4.pom
          for u in https://repo.maven.apache.org/maven2 https://plugins.gradle.org/m2 https://dl.google.com/dl/android/maven2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 "$u/$P")
            echo "$u -> $code"
          done

      - name: 打包 Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 整理产物与发布说明
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/
          ( cd dist && sha256sum ./*.apk > xuanxing-sha256.txt )
          {
            echo "触发方式：${{ steps.meta.outputs.trigger }}（commit \`${GITHUB_SHA}\`）"
            echo ""
            echo "## 下载说明"
            echo "- **app-universal-release.apk** —— 通用包，所有手机都能装（推荐）"
            echo "- **app-arm64-v8a-release.apk** —— 仅 64 位 ARM 手机，体积更小"
            echo "- **app-x86_64-release.apk** —— 仅 x86_64 设备 / 模拟器"
            echo ""
            echo "安装前请先卸载不同签名的旧版本（debug 与 release 签名互不兼容）。"
            echo ""
            echo "## SHA-256"
            echo '```'
            cat dist/xuanxing-sha256.txt
            echo '```'
          } > dist/release-notes.md
          ls -lh dist/

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: 玄星 ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: dist/release-notes.md
          files: |
            dist/*.apk
            dist/xuanxing-sha256.txt