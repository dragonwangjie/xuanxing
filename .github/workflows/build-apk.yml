name: Build Test APK

# 自用测试打包：手动点击即可触发，产出可直接安装的 debug APK。
# 已移除 Firebase，无需 google-services.json；debug 构建用自动签名，无需任何密钥。
on:
  workflow_dispatch:   # 在 GitHub 网页 Actions 页面手动点击 "Run workflow" 触发

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI 关闭国内镜像：aliyun 镜像在海外 runner 上不稳定，会让插件解析失败
      XUANXING_CN_MIRROR: "0"
    steps:
      - name: 检出代码（含子模块，必须 recursive）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # AGP 9.x 需要 JDK 21（AGP 8.2 才用 17）
      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # web 模块的 preBuild 会执行前端构建，需要 Node + pnpm
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: 安装 web-ui 依赖
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # :workspace 模块启用了 CMake 原生构建，需要 NDK。
      # 交给 AGP 自动下载时偶发 "Error reading Zip content from a SeekableByteChannel"
      # （下载包损坏）且一次失败就整轮报废，所以这里显式用 sdkmanager 预装并重试；
      # 若 runner 已自带该版本，命令本身就是幂等 no-op。
      #
      # 用 `bash {0}` 显式接管 shell：默认的 `bash -eo pipefail` 下，
      # `yes | sdkmanager` 会因为 yes 收到 SIGPIPE 退出 141，导致 pipefail
      # 把「安装成功」误判成失败。
      - name: 预装 NDK（带重试，规避 AGP 自动下载损坏）
        shell: bash {0}
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          echo "using sdkmanager: ${SDKMANAGER:-none}"
          if [ -z "${SDKMANAGER:-}" ] || [ -z "${ANDROID_HOME:-}" ]; then
            echo "runner 上没有 sdkmanager/ANDROID_HOME，交给 AGP 自行下载"
            exit 0
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "--- sdkmanager attempt $attempt ---"
            if yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "ndk;$NDK_VERSION"; then
              ok=1
              echo "NDK 安装成功（attempt $attempt）"
              break
            fi
            echo "attempt $attempt 失败，清理半成品后重试"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "sdkmanager 安装失败，最终交给 AGP 再试一次"
          fi
          ls -d "$ANDROID_HOME/ndk/"* 2>/dev/null
          exit 0

      - name: 打包 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 项目启用了 ABI 拆分，会产出多个 APK：
      #   app-universal-debug.apk  —— 通用包，兼容所有手机，装这个最省心（推荐）
      #   app-arm64-v8a-debug.apk  —— 仅 64 位 ARM 手机（体积更小）
      #   app-x86_64-debug.apk     —— 仅 x86_64 设备/模拟器
      - name: 列出产物
        run: ls -lh app/build/outputs/apk/debug/

      # 上传 APK，构建完成后在本次运行页面底部 "Artifacts" 处下载 rikkahub-debug-apk.zip
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
